

services:
  # Servicio del Backend (FastAPI)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code 
    environment:
      - DATABASE_URL=mongodb://db:27017
    depends_on:
      - db

  # Servicio de la Base de Datos (MongoDB)
  db:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Servicio del Frontend (React) 
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  mongo-data: