services:
  # Servicio del Backend (FastAPI)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code 
    environment:
      - DATABASE_URL=mongodb://db:27017
    depends_on:
      - db
    networks: # <--- AÑADIDO
      - app-network

  # Servicio de la Base de Datos (MongoDB)
  db:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks: # <--- AÑADIDO
      - app-network

  # Servicio del Frontend (React) 
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks: # <--- AÑADIDO
      - app-network

  # --- SERVICIOS DE MONITORING PEGADOS ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      # Ruta corregida para apuntar a la carpeta monitoring/
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    ports:
      - "9090:9090"
    networks: # <--- CAMBIADO
      - app-network
    
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000" # ¡Perfecto que ya cambiaste el puerto!
    networks: # <--- CAMBIADO
      - app-network
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Cambiado a "named volume" para ser consistente
      - grafana-data:/var/lib/grafana

  # --- AÑADIR SERVICIOS DE LOGS ---

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100" 
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml
    networks:
      - app-network
    command: -config.file=/etc/loki/config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      # Monta el archivo de config que acabamos de crear
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      # Monta el Docker Socket para que pueda leer los logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    depends_on:
      - loki

volumes:
  mongo-data:
  grafana-data:
  loki-data:

# --- RED ÚNICA PARA TODOS LOS SERVICIOS ---
networks:
  app-network:
    driver: bridge